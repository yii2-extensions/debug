---
on:
  pull_request: &ignore-paths
    paths-ignore:
      - ".gitattributes"
      - ".gitignore"
      - "CHANGELOG.md"
      - "docs/**"
      - "README.md"

  push: *ignore-paths

name: build

permissions:
  contents: read

jobs:
  phpunit:
    uses: yii2-framework/actions/.github/workflows/phpunit.yml@7a2d60325d59c5c9377fd445c912f2f1bfacf9d9 # v2.0.2
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      concurrency-group: phpunit-${{ github.workflow }}-${{ github.ref }}
      extensions: gd, intl, pdo, pdo_sqlite
      php-version: '["8.3","8.4","8.5"]'
